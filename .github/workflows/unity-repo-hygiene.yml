name: unity-repo-hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity repository hygiene
        shell: pwsh
        run: ./Tools/Git/Validate-UnityRepo.ps1
